version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: cloudguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cloud-agent
    networks:
      - cloudguard-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/cloud-agent
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cloudguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudguard-net

networks:
  cloudguard-net:
    driver: bridge

volumes:
  mongo_data:
